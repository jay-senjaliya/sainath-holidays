name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file tourtravel-backend/pom.xml -DskipTests
      
      # Step for tests would go here if unit tests were enabled
      # - name: Run Tests
      #   run: mvn test --file tourtravel-backend/pom.xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: tourtravel-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./tourtravel-frontend
      - name: Build React App
        run: npm run build
        working-directory: ./tourtravel-frontend
