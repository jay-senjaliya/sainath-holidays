spring:
  autoconfigure:
    exclude:
      # Fully disable Redis wiring in local dev — prevents connection-refused errors
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.redis.RedisHealthContributorAutoConfiguration
  cache:
    type: none
  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: update   # Use 'update' to preserve data on restart
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed.sql

server:
  port: 8085

logging:
  level:
    com.tourtravel: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
