spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cache:
    type: none

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  # Prevents crash if OAuth secrets are missing in Render settings
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:fake-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:fake-secret}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 2048

jwt:
  secret: ${JWT_SECRET:MyDefaultStrongSecretKeyForProd2026!}
  expiration: 3600000
  refresh-expiration: 86400000

logging:
  level:
    root: INFO
    com.tourtravel: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
    org.springframework.security: DEBUG
